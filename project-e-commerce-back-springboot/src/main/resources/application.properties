spring.application.name=project-e-commerce
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3307/projet-spring-ecommerce?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

server.error.include-message=always
server.error.include-stacktrace=never

# Dossier où les images uploadées par l'admin sont enregistrées (servi par Vite)
app.upload-dir=C:/e-commerce-spring/projet-ecommerce-front-react/projet-ecommerce/public